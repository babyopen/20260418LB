<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高亮划线笔记工具</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .content {
      margin-bottom: 30px;
      float: left;
      width: 70%;
    }

    #toolbar {
      position: fixed;
      display: none;
      background: #333;
      border-radius: 4px;
      padding: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    #toolbar button {
      background: #444;
      color: white;
      border: none;
      padding: 5px 10px;
      margin: 0 2px;
      border-radius: 3px;
      cursor: pointer;
    }

    #toolbar button:hover {
      background: #555;
    }

    .underline {
      cursor: pointer;
      position: relative;
      border-bottom: 2px solid #ff6b6b;
    }

    .underline:hover::after {
      content: "×";
      position: absolute;
      right: -15px;
      top: -10px;
      color: red;
      font-size: 16px;
      background: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 3px rgba(0,0,0,0.3);
    }

    #notes-container {
      float: right;
      width: 25%;
      border-left: 1px solid #eee;
      padding-left: 20px;
      margin-top: 30px;
    }

    .note {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 3px solid #4CAF50;
    }

    .note-text {
      font-style: italic;
      color: #555;
    }

    .note-content {
      font-weight: bold;
    }

    .highlight {
      background-color: #ffff00;
      cursor: pointer;
    }

    .note-popup {
      display: none;
      position: absolute;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 1001;
      font-size: 14px;
      line-height: 1.6;
      min-width: 150px;
    }

    .note-popup.active {
      display: block;
    }

    .note-popup .note-content {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .note-popup .note-text {
      font-style: italic;
      color: #555;
      margin-bottom: 15px;
    }

    .note-popup .note-actions {
      display: flex;
      justify-content: space-between;
    }

    .note-popup .note-actions button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .note-popup .note-actions button:hover {
      background: #45a049;
    }

    .note-popup .note-actions button.delete {
      background: #f44336;
    }

    .note-popup .note-actions button.delete:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>
<div id="toolbar">
  <button id="underline-btn">划线</button>
  <button id="note-btn">记笔记</button>
  <button id="copy-btn">复制</button>
</div>
<div id="note-popup" class="note-popup">
  <div class="note-content"></div>
  <div class="note-text"></div>
  <div class="note-actions">
    <button class="edit">编辑</button>
    <button class="delete">删除</button>
  </div>
</div>
<div id="content" class="content">
  <h1>高亮划线笔记工具</h1>
  <p>本工具专为文本阅读与标注设计，支持划线高亮、添加笔记和复制选中内容。只需简单操作，即可提升您的阅读效率与学习体验。</p>
  <p>无论是在学习资料中标注重点、整理研究内容，还是在文档中记录想法，高亮划线笔记工具都能助您高效掌握关键信息。</p>
</div>
<div id="notes-container">
  <h2>我的笔记</h2>
  <div id="notes-list"></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const toolbar = document.getElementById('toolbar');
    const contentElem = document.getElementById('content');
    const underlineBtn = document.getElementById('underline-btn');
    const noteBtn = document.getElementById('note-btn');
    const copyBtn = document.getElementById('copy-btn');
    const notesList = document.getElementById('notes-list');
    const notePopup = document.getElementById('note-popup');
    const noteContent = notePopup.querySelector('.note-content');
    const noteText = notePopup.querySelector('.note-text');
    const editBtn = notePopup.querySelector('.edit');
    const deleteBtn = notePopup.querySelector('.delete');

    let selectedText = '';
    let selectedRange = null;
    let currentNote = null;
    let noteIdCounter = 0;

    // 显示工具栏
    contentElem.addEventListener('mouseup', function(e) {
      selectedText = window.getSelection().toString().trim();
      if (selectedText.length > 0) {
        // 获取选中的范围
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
          selectedRange = selection.getRangeAt(0);
        }

        // 定位工具栏
        toolbar.style.display = 'block';

        // 获取选中范围的边界矩形
        const rangeRect = selectedRange.getBoundingClientRect();
        const centerX = rangeRect.left + rangeRect.width / 2;
        const centerY = rangeRect.top + rangeRect.height / 2;

        // 设置工具栏位置为中心点
        toolbar.style.left = (centerX - toolbar.offsetWidth / 2) + 'px';
        toolbar.style.top = (centerY - 60) + 'px';
      } else {
        toolbar.style.display = 'none';
      }
    });

    // 点击页面其他地方隐藏工具栏
    document.addEventListener('mousedown', function(e) {
      if (!toolbar.contains(e.target)) {
        toolbar.style.display = 'none';
      }
    });

    // 划线功能
    underlineBtn.addEventListener('click', function() {
      if (selectedRange && selectedText.length > 0) {
        const span = document.createElement('span');
        span.className = 'underline';
        // 添加点击事件来删除划线
        span.addEventListener('click', function(e) {
          e.stopPropagation();
          const parent = this.parentNode;
          const text = document.createTextNode(this.textContent);
          parent.replaceChild(text, this);
          parent.normalize();
        });
        selectedRange.surroundContents(span);
        toolbar.style.display = 'none';
        // 清除选择状态
        window.getSelection().removeAllRanges();
      }
    });

    // 复制功能
    copyBtn.addEventListener('click', function() {
      if (selectedText.length > 0) {
        navigator.clipboard.writeText(selectedText)
                .then(() => {
                  alert('已复制到剪贴板: ' + selectedText);
                  toolbar.style.display = 'none';
                })
                .catch(err => {
                  console.error('复制失败: ', err);
                });
      }
    });

    // 记笔记功能
    noteBtn.addEventListener('click', function() {
      if (selectedText.length > 0) {
        const noteTextContent = prompt('为选中的文本添加笔记:', '');
        if (noteTextContent !== null) {
          const noteId = noteIdCounter++;
          const noteElement = document.createElement('div');
          noteElement.className = 'note';
          noteElement.dataset.noteId = noteId;
          noteElement.innerHTML = `<div class="note-content">"${selectedText}"</div>
                            <div class="note-text">${noteTextContent}</div>
                            <small>${new Date().toLocaleString()}</small>`;
          // 添加高亮效果
          const highlight = document.createElement('span');
          highlight.className = 'highlight';
          highlight.textContent = selectedText;
          highlight.dataset.noteId = noteId;
          selectedRange.deleteContents();
          selectedRange.insertNode(highlight);
          // 添加点击事件显示笔记
          highlight.addEventListener('click', function(e) {
            e.stopPropagation();
            currentNote = this;
            noteContent.textContent = `"${this.textContent}"`;
            const noteElement = document.querySelector(`.note[data-note-id="${this.dataset.noteId}"]`);
            if (noteElement) {
              noteText.textContent = noteElement.querySelector('.note-text').textContent;
            }
            notePopup.style.left = e.pageX + 'px';
            notePopup.style.top = e.pageY + 'px';
            notePopup.classList.add('active');
          });
          notesList.appendChild(noteElement);
          toolbar.style.display = 'none';
          // 清除选择状态
          window.getSelection().removeAllRanges();
        }
      }
    });

    // 编辑笔记
    editBtn.addEventListener('click', function() {
      const newText = prompt('编辑笔记:', noteText.textContent);
      if (newText !== null) {
        const noteId = currentNote.dataset.noteId;
        const noteElement = document.querySelector(`.note[data-note-id="${noteId}"]`);
        if (noteElement) {
          noteElement.querySelector('.note-text').textContent = newText;
          noteText.textContent = newText;
        }
      }
    });

    // 删除笔记
    deleteBtn.addEventListener('click', function() {
      const noteId = currentNote.dataset.noteId;
      const noteElement = document.querySelector(`.note[data-note-id="${noteId}"]`);
      if (noteElement) {
        noteElement.remove();
      }
      currentNote.parentNode.replaceChild(document.createTextNode(currentNote.textContent), currentNote);
      notePopup.classList.remove('active');
    });

    // 点击页面其他地方隐藏笔记弹窗
    document.addEventListener('mousedown', function(e) {
      if (!notePopup.contains(e.target)) {
        notePopup.classList.remove('active');
      }
    });
  });
</script>
</body>
</html>
