<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Text 全能记事本</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif}
html,body{height:100%;background:#f7f8fa;color:#222}
body{display:flex;flex-direction:column}

/* 深色 / 护眼 */
body.dark{background:#121212;color:#eee}
body.warm{background:#fff9e6;color:#333}

/* 标签栏 */
.tabbar{
  display:flex;gap:8px;padding:10px 12px;
  background:#fff;border-bottom:1px solid #e8e8ed;
}
body.dark .tabbar{background:#1e1e1e;border-color:#333}
body.warm .tabbar{background:#fff5d7;border-color:#f5e6c6}

.tab{
  padding:6px 12px;border-radius:12px;
  background:#f1f3f5;color:#333;
  cursor:pointer;white-space:nowrap;
  transition:.2s;
}
body.dark .tab{background:#2a2a2a;color:#eee}
.tab.active{background:#007bff;color:#fff}

.add-tab{
  width:32px;height:32px;border-radius:50%;
  border:none;background:#007bff;color:#fff;
  font-size:16px;cursor:pointer;
}

/* 工具栏 */
.toolbar{
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;
  background:#fff;border-bottom:1px solid #e8e8ed;
  transition:all .3s ease;
}
body.dark .toolbar{background:#1e1e1e;border-color:#333}
body.warm .toolbar{background:#fff5d7;border-color:#f5e6c6}
.toolbar.collapsed{
  padding:5px 12px;
  height:40px;
  overflow:hidden;
}
.toolbar.collapsed::after{
  content:'点击展开工具栏';
  position:absolute;
  right:12px;
  top:10px;
  font-size:12px;
  color:#888;
  cursor:pointer;
}
body.dark .toolbar.collapsed::after{color:#999}
body.warm .toolbar.collapsed::after{color:#777}

.toolbar button{
  padding:6px 10px;border-radius:10px;
  border:none;background:#f1f3f5;color:#222;
  font-size:13px;cursor:pointer;
  transition:.2s;
}
body.dark .toolbar button{background:#2a2a2a;color:#eee}
.toolbar button:hover{background:#007bff;color:#fff}

/* 统计栏 */
.statbar{
  padding:8px 14px;font-size:12px;color:#888;
  background:#fff;border-bottom:1px solid #e8e8ed;
}
body.dark .statbar{background:#1e1e1e;color:#999;border-color:#333}
body.warm .statbar{background:#fff5d7;color:#777;border-color:#f5e6c6}

/* 编辑区 */
.editor{
  flex:1;width:100%;padding:16px;
  border:none;outline:none;resize:none;
  font-size:16px;line-height:1.7;
  background:#fff;color:#222;
}
body.dark .editor{background:#121212;color:#eee}
body.warm .editor{background:#fff9e6;color:#222}

/* 二维码弹窗 */
.qr-box{
  position:fixed;right:16px;bottom:16px;
  background:#fff;padding:12px;border-radius:14px;
  box-shadow:0 4px 20px #0002;display:none;
}
body.dark .qr-box{background:#1e1e1e}

#fileInput{display:none}
</style>
</head>

<body>
<div class="tabbar" id="tabbar">
  <div class="tab active" data-id="1">文档 1</div>
  <button class="add-tab" onclick="addTab()">+</button>
</div>

<div class="toolbar" id="toolbar">
  <button onclick="toggleToolbar()">折叠</button>
  <button onclick="newFile()">新建</button>
  <button onclick="openFile()">打开TXT</button>
  <button onclick="saveFile()">保存</button>
  <button onclick="toggleDark()">深色</button>
  <button onclick="toggleWarm()">护眼</button>
  <button onclick="insertTime()">插入时间</button>
  <button onclick="copyText()">复制全文</button>
  <button onclick="toggleFullscreen()">全屏</button>
  <button onclick="fontSize(1)">A+</button>
  <button onclick="fontSize(-1)">A-</button>
  <button onclick="toUpper()">转大写</button>
  <button onclick="toLower()">转小写</button>
  <button onclick="trimLines()">去空行</button>
  <button onclick="uniqueLines()">去重行</button>
  <button onclick="reverseLines()">逆序</button>
  <button onclick="exportPDF()">导出PDF</button>
  <button onclick="makeQR()">二维码</button>
  <button onclick="speakText()">朗读</button>
  <button onclick="focusMode()">专注模式</button>
  <button onclick="typeSound()">打字音效</button>
  <button onclick="backupAll()">备份</button>
  <button onclick="restoreAll()">恢复</button>
  <button onclick="showHistory()">历史回滚</button>
</div>

<div class="statbar" id="stat">总字符：0 | 中文：0 | 英文：0 | 行数：0</div>

<textarea class="editor" id="editor" placeholder="开始输入内容…"></textarea>
<div class="qr-box" id="qrBox"><div id="qrcode"></div></div>
<input type="file" id="fileInput" accept=".txt">

<script>
const editor = document.getElementById('editor');
const stat = document.getElementById('stat');
let tabs = {1:''};
let currentTab = 1;
let tabId = 1;
let history = [];
let sound = false;

window.onload = () => {
  loadTab(currentTab);
  autoSaveLoop();
  recordHistory();
}

editor.oninput = () => {
  tabs[currentTab] = editor.value;
  saveTab();
  updateStat();
  recordHistory();
  if(sound){
    let audio = new Audio('https://cdn.jsdelivr.net/gh/ashisha7up/keyboard-sounds/click1.mp3');
    audio.play().catch(()=>{});
  }
}

// 统计
function updateStat(){
  let v = editor.value;
  let total = v.length;
  let cn = (v.match(/[\u4e00-\u9fa5]/g) || []).length;
  let en = (v.match(/[a-zA-Z]/g) || []).length;
  let lines = v.split('\n').length;
  stat.textContent = `总字符：${total} | 中文：${cn} | 英文：${en} | 行数：${lines}`;
}

// 标签
function saveTab(){ localStorage.setItem('tabs', JSON.stringify(tabs)) }
function loadTab(id){ editor.value = tabs[id] || ''; updateStat() }

function addTab(){
  tabId++;
  tabs[tabId] = '';
  let el = document.createElement('div');
  el.className = 'tab';
  el.dataset.id = tabId;
  el.textContent = '文档 ' + tabId;
  el.onclick = () => {
    currentTab = tabId;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadTab(tabId);
  }
  document.getElementById('tabbar').insertBefore(el, document.querySelector('.add-tab'));
}

// 文件
function newFile(){ editor.value = ''; tabs[currentTab] = ''; saveTab(); updateStat() }

function saveFile(){
  let blob = new Blob([editor.value], {type:'text/plain'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'note.txt';
  a.click();
}

function openFile(){ document.getElementById('fileInput').click() }
document.getElementById('fileInput').onchange = e => {
  let f = e.target.files[0];
  if(!f) return;
  let r = new FileReader();
  r.readAsText(f, 'UTF-8');
  r.onload = () => {
    editor.value = r.result;
    tabs[currentTab] = editor.value;
    saveTab();
    updateStat();
  }
}

// 主题
function toggleDark(){ document.body.classList.toggle('dark') }
function toggleWarm(){ document.body.classList.toggle('warm') }

// 工具
function insertTime(){ editor.value += new Date().toLocaleString() + '\n'; tabs[currentTab] = editor.value; saveTab(); updateStat() }
function copyText(){ editor.select(); document.execCommand('copy'); alert('已复制全文') }
function toggleFullscreen(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen() }
function fontSize(d){
  let sz = parseInt(getComputedStyle(editor).fontSize);
  editor.style.fontSize = (sz + d * 2) + 'px';
}
function toUpper(){ editor.value = editor.value.toUpperCase(); tabs[currentTab] = editor.value; saveTab() }
function toLower(){ editor.value = editor.value.toLowerCase(); tabs[currentTab] = editor.value; saveTab() }
function trimLines(){ editor.value = editor.value.split('\n').filter(l => l.trim()).join('\n'); tabs[currentTab] = editor.value; saveTab(); updateStat() }
function uniqueLines(){ editor.value = [...new Set(editor.value.split('\n'))].join('\n'); tabs[currentTab] = editor.value; saveTab(); updateStat() }
function reverseLines(){ editor.value = editor.value.split('\n').reverse().join('\n'); tabs[currentTab] = editor.value; saveTab() }

// 导出
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text(editor.value, 10, 10);
  doc.save('记事本.pdf');
}

function makeQR(){
  document.getElementById('qrBox').style.display = 'block';
  QRCode.toCanvas(document.getElementById('qrcode'), editor.value, { width:130 })
}

function speakText(){
  let s = new SpeechSynthesisUtterance(editor.value);
  s.lang = 'zh-CN';
  window.speechSynthesis.speak(s);
}

function focusMode(){
  document.body.classList.toggle('focus');
}

function typeSound(){ sound = !sound; alert(sound ? '打字音效已开启' : '打字音效已关闭') }

// 备份
function backupAll(){
  let blob = new Blob([JSON.stringify(tabs)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '记事本备份.json';
  a.click();
}

function restoreAll(){
  let inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    let f = e.target.files[0];
    if(!f) return;
    let r = new FileReader();
    r.readAsText(f);
    r.onload = () => {
      tabs = JSON.parse(r.result);
      saveTab();
      loadTab(currentTab);
    }
  }
  inp.click();
}

// 历史
function recordHistory(){
  if(history.length > 30) history.shift();
  history.push(editor.value);
}
function showHistory(){
  if(history.length < 2) return;
  editor.value = history[history.length - 2] || '';
  tabs[currentTab] = editor.value;
  saveTab();
  updateStat();
}

// 自动保存
function autoSaveLoop(){ setInterval(saveTab, 30000) }

// 工具栏折叠
function toggleToolbar(){
  const toolbar = document.getElementById('toolbar');
  const toggleBtn = toolbar.querySelector('button:first-child');
  toolbar.classList.toggle('collapsed');
  if(toolbar.classList.contains('collapsed')){
    toggleBtn.textContent = '展开';
  } else {
    toggleBtn.textContent = '折叠';
  }
}

// 拖放
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  let f = e.dataTransfer.files[0];
  if(!f || !f.name.endsWith('.txt')) return;
  let r = new FileReader();
  r.readAsText(f, 'UTF-8');
  r.onload = () => {
    editor.value = r.result;
    tabs[currentTab] = editor.value;
    saveTab();
    updateStat();
  }
});
</script>
</body>
</html>
